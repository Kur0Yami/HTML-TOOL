<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Filelist Editor</title>
<meta name="application-name" content="Filelist Editor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Filelist">
<meta name="theme-color" content="#0d1117">
<script>
// Inject PWA manifest via blob
(function(){
  const manifest={
    name:"Filelist Editor",short_name:"Filelist",
    start_url:".",display:"standalone",
    background_color:"#0d1117",theme_color:"#0d1117",
    description:"Filter, sort & save filelist",
    icons:[
      {src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='24' fill='%230d1117'/%3E%3Ctext x='96' y='130' text-anchor='middle' font-size='110' font-family='system-ui'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E",sizes:"192x192",type:"image/svg+xml"},
      {src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='48' fill='%230d1117'/%3E%3Ctext x='256' y='360' text-anchor='middle' font-size='300' font-family='system-ui'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E",sizes:"512x512",type:"image/svg+xml"}
    ]
  };
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('link');
  link.rel='manifest';link.href=url;
  document.head.appendChild(link);

  // Register inline Service Worker via blob for PWA installability
  if('serviceWorker' in navigator){
    const swCode=`
const CACHE='filelist-v1';
const ASSETS=[self.location.href.replace('/sw-blob','')];
self.addEventListener('install',e=>{
  e.waitUntil(caches.open(CACHE).then(c=>c.addAll([])));
  self.skipWaiting();
});
self.addEventListener('activate',e=>{self.clients.claim();});
self.addEventListener('fetch',e=>{
  e.respondWith(
    caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>new Response('offline',{status:503})))
  );
});
    `;
    const swBlob=new Blob([swCode],{type:'application/javascript'});
    const swUrl=URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl,{scope:'./'}).catch(()=>{});
  }
})();
</script>
<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;
  --border:#30363d;--text:#c9d1d9;--dim:#8b949e;
  --accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#e3b341;
  --tab-h:48px;--bar-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}

/* TABS */
#tabs{
  display:flex;background:var(--bg2);border-bottom:1px solid var(--border);
  height:var(--tab-h);flex-shrink:0;
}
.tab{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:13px;font-weight:600;color:var(--dim);cursor:pointer;
  border-bottom:2px solid transparent;transition:all .15s;
  padding:0 8px;
}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .badge{
  background:var(--accent);color:#000;border-radius:10px;
  padding:1px 6px;font-size:10px;font-weight:700;min-width:18px;text-align:center;
  display:none;
}
.tab .badge.show{display:inline-block}

/* PAGES */
#app{display:flex;flex-direction:column;height:100vh}
#pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .15s}
.page.active{opacity:1;pointer-events:all}

/* FIND BAR */
#ed-find-bar{
  display:flex;align-items:center;gap:6px;
  padding:6px 10px;background:var(--bg2);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
#ed-find{
  flex:1;background:var(--bg3);border:1px solid var(--border);
  color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px;outline:none;min-width:0;
}
#ed-find:focus{border-color:var(--accent)}
#find-info{font-size:11px;color:var(--dim);white-space:nowrap;min-width:36px;text-align:center}
.find-btn{
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;
  flex-shrink:0;transition:all .15s;
}
.find-btn:active{opacity:.6}
.sort-btn{color:var(--yellow);border-color:var(--yellow)}
.sort-btn.desc{color:var(--green);border-color:var(--green)}

/* EDITOR PAGE */
#ed-meta{
  padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);
  font-size:11px;color:var(--dim);display:flex;justify-content:space-between;align-items:center;
  flex-shrink:0;
}
#ed-meta code{color:var(--yellow);font-size:11px}
#editor{
  flex:1;background:var(--bg);color:var(--text);border:none;outline:none;
  font-family:'Cascadia Code','JetBrains Mono',monospace;font-size:13px;line-height:1.7;
  resize:none;padding:12px;overflow:auto;white-space:pre;
}
#editor::-webkit-scrollbar{width:3px}
#editor::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ACTION BAR (editor) */
#ed-bar{
  background:var(--bg2);border-top:1px solid var(--border);
  padding:8px 10px;display:flex;gap:8px;flex-shrink:0;
  padding-bottom:max(8px, env(safe-area-inset-bottom));
}
#ed-bar .btn{flex:1}

/* LIST PAGE */
#list-search{
  padding:8px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;
}
#list-search input{
  width:100%;background:var(--bg3);border:1px solid var(--border);
  color:var(--text);padding:9px 12px;border-radius:8px;font-size:14px;outline:none;
}
#list-search input:focus{border-color:var(--accent)}
#list-body{flex:1;overflow-y:auto;padding:8px}
#list-body::-webkit-scrollbar{width:3px}
#list-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.li{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;border-radius:8px;margin-bottom:4px;
  background:var(--bg2);border:1px solid var(--border);
}
.li .num{font-size:10px;color:var(--dim);min-width:20px;text-align:right;flex-shrink:0}
.it{flex:1;font-size:14px;line-height:1.4;word-break:break-word;cursor:pointer;padding:2px 0}
.ie{
  flex:1;background:var(--bg3);border:1px solid var(--accent);
  color:var(--text);border-radius:6px;padding:6px 10px;
  font-size:14px;outline:none;min-width:0;
}
.dl{
  background:none;border:none;color:var(--dim);cursor:pointer;
  font-size:20px;padding:4px 6px;flex-shrink:0;line-height:1;
}
.dl:active{color:var(--red)}
#list-bar{
  background:var(--bg2);border-top:1px solid var(--border);
  padding:8px 10px;display:flex;gap:8px;flex-shrink:0;
  padding-bottom:max(8px, env(safe-area-inset-bottom));
}
#list-bar .btn{flex:1}

/* SHARED BTN */
.btn{
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:12px 10px;border-radius:8px;cursor:pointer;font-size:13px;
  font-weight:600;transition:all .15s;text-align:center;display:block;
  -webkit-user-select:none;user-select:none;
}
.btn:active{opacity:.7}
.btn.p{background:var(--accent);color:#000;border-color:var(--accent)}
.btn.g{background:var(--green);color:#000;border-color:var(--green)}
.btn.r{border-color:var(--red);color:var(--red)}
.btn.r:active{background:var(--red);color:#fff}

/* ALIAS */
.it-name{color:var(--text)}
.it-alias{color:var(--dim);font-size:12px}
.it-alias::before{content:'→ ';color:var(--green);font-size:11px}
.alias-chip{
  background:var(--bg3);border:1px solid var(--border);
  color:var(--dim);border-radius:6px;padding:2px 8px;
  font-size:11px;font-weight:600;flex-shrink:0;cursor:pointer;
  transition:all .15s;user-select:none;-webkit-user-select:none;
}
.alias-chip.on{background:#1a3a1a;border-color:var(--green);color:var(--green)}

/* HINT */
.hint{text-align:center;padding:40px 20px;color:var(--dim);font-size:14px;line-height:2}
.hint b{color:var(--accent)}

/* BULK BAR */
#bulk-bar{display:flex;gap:6px;padding:6px 10px;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0}
#bulk-input{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px;outline:none;min-width:0}
#bulk-input:focus{border-color:var(--red)}
#pr-search-bar{display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
#pr-fr{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-size:14px;outline:none;min-width:0}
#pr-fr:focus{border-color:var(--accent)}
.pr-save-btn{background:var(--green)!important;color:#000!important;border-color:var(--green)!important;font-weight:700;padding:8px 14px;white-space:nowrap}
#pr-preview{padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;min-height:48px;display:flex;flex-direction:column;gap:4px}
.pr-prev-fr{font-size:11px;color:var(--dim)}
.pr-prev-chars{font-size:13px;color:var(--green);font-family:'Cascadia Code','JetBrains Mono',monospace;word-break:break-all}
.pr-prev-empty{font-size:12px;color:var(--dim);font-style:italic}
.pr-prev-count{font-size:11px;color:var(--accent)}
#pr-body{flex:1;overflow-y:auto;font-family:'Cascadia Code','JetBrains Mono',monospace;font-size:12px;line-height:1.8;padding:10px 12px;background:var(--bg);color:var(--text);white-space:pre-wrap;word-break:break-word}
#pr-body::-webkit-scrollbar{width:3px}
#pr-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
#pr-body mark{background:var(--yellow);color:#000;border-radius:2px;padding:0 1px}
#pr-bar{background:var(--bg2);border-top:1px solid var(--border);padding:8px 10px;display:flex;gap:6px;flex-shrink:0;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#pr-bar .btn{flex:1}

/* TOAST */
#toast{
  position:fixed;bottom:80px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:10px 18px;border-radius:20px;font-size:13px;
  opacity:0;transition:all .2s;pointer-events:none;z-index:999;
  white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}
#toast.s{opacity:1;transform:translateX(-50%) translateY(0)}

/* INFO CHIP */
#ed-info{font-size:11px;color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <div id="tabs">
    <div class="tab active" onclick="showTab('editor')" id="t-editor">✏️ Editor</div>
    <div class="tab" onclick="showTab('list')" id="t-list">📋 List <span class="badge" id="badge">0</span></div>
    <div class="tab" onclick="showTab('parse')" id="t-parse">🗂 Parse <span class="badge" id="badge-parse">0</span></div>
  </div>

  <div id="pages">
    <!-- EDITOR -->
    <div class="page active" id="p-editor">
      <div id="ed-find-bar">
        <input type="text" id="ed-find" placeholder="🔍 Filter baris..." oninput="doFind(this.value)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <span id="find-info"></span>
        <button class="find-btn" id="find-clear-btn" onclick="clearFind()" style="display:none">✕</button>
        <button class="find-btn sort-btn" id="sort-btn" onclick="sortEditor()">A↓</button>
      </div>
      <div id="ed-meta">
        <span id="ed-info">Editor kosong — load file dulu</span>
        <span style="font-size:10px;color:var(--dim)">Upload → otomatis ke Parse ✓</span>
      </div>
      <textarea id="editor" spellcheck="false"></textarea>
      <div id="ed-filter-view" style="display:none;flex:1;overflow-y:auto;padding:12px;font-family:'Cascadia Code','JetBrains Mono',monospace;font-size:13px;line-height:1.7;background:var(--bg);color:var(--text);white-space:pre-wrap;word-break:break-word;"></div>
      <div id="bulk-bar">
        <input type="text" id="bulk-input" placeholder="✂️ Hapus teks dari semua baris..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')bulkRemove()">
        <button class="find-btn" onclick="bulkRemove()">Hapus</button>
      </div>
      <div id="ed-bar">
        <button class="btn p" onclick="cleanSel()">🧹 Clean</button>
        <button class="btn g" onclick="saveSel()">💾 Save</button>
        <button class="btn" onclick="loadF()">📁 Load</button>
        <input type="file" id="fi" accept=".txt" style="display:none" onchange="handleF(event)">
      </div>
    </div>

    <!-- PARSE -->
    <div class="page" id="p-parse">
      <div id="pr-search-bar">
        <input type="text" id="pr-fr" placeholder="🔍 Cari franchise... (contoh: seven knights)" oninput="prSearch()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="find-btn pr-save-btn" id="pr-save" onclick="prSave()" style="display:none">💾 Save</button>
      </div>
      <div id="pr-preview"></div>
      <div id="pr-body"></div>
      <div id="pr-bar">
        <button class="btn" onclick="prPaste()">📋 Paste</button>
        <button class="btn" onclick="prLoad()">📁 Load</button>
        <input type="file" id="pr-fi" accept=".txt" style="display:none" onchange="prHandleFile(event)">
        <button class="btn r" onclick="prClear()">🗑</button>
      </div>
    </div>

    <!-- LIST -->
    <div class="page" id="p-list">
      <div id="list-search">
        <input type="text" id="si" placeholder="🔍 Filter... (Enter untuk sort)" oninput="scheduleRender()" onkeydown="if(event.key==='Enter')renderNow()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
      <div id="list-body"><div class="hint">Belum ada item.<br>Pilih teks di <b>Editor</b><br>lalu klik <b>💾 Save</b></div></div>
      <div id="list-bar">
        <button class="btn" onclick="copyList()">📋 Copy</button>
        <button class="btn" onclick="exportList()">💾 Export</button>
        <span class="alias-chip" id="alias-toggle" onclick="toggleAlias()">A→</span>
        <button class="btn r" onclick="clearAll()">🗑 Clear</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const CLEAN=/[,_\-\'\':;!?()\x2F]/g;
let items=[];
let autoAlias=true;

// ── localStorage ─────────────────────────────────────
const LS_ITEMS='fle_items',LS_ED='fle_ed',LS_ALIAS='fle_alias';
function lsSave(){
  try{
    localStorage.setItem(LS_ITEMS,JSON.stringify(items));
    localStorage.setItem(LS_ED,document.getElementById('editor').value);
    localStorage.setItem(LS_ALIAS,String(autoAlias));
  }catch(e){}
}
function lsLoad(){
  try{
    const it=localStorage.getItem(LS_ITEMS);
    if(it) items=JSON.parse(it);
    const ed=localStorage.getItem(LS_ED);
    if(ed) document.getElementById('editor').value=ed;
    const al=localStorage.getItem(LS_ALIAS);
    if(al!==null) autoAlias=(al==='true');
  }catch(e){}
}
lsLoad();
upd();
render();

document.getElementById('editor').addEventListener('keyup',()=>{upd();lsSave();});
document.getElementById('editor').addEventListener('click',upd);

// init alias chip state
(function(){
  const chip=document.getElementById('alias-toggle');
  chip.classList.toggle('on',autoAlias);
  chip.textContent=autoAlias?'✓ A→':'A→';
})();

function showTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('t-'+id).classList.add('active');
  document.getElementById('p-'+id).classList.add('active');
}

function upd(){
  const ed=document.getElementById('editor');
  const v=ed.value;
  const ln=v.split('\n').length;
  const sel=ed.selectionEnd-ed.selectionStart;
  document.getElementById('ed-info').textContent=
    `${ln.toLocaleString()} baris`+(sel>0?` · Sel: ${sel} char`:'');
}

function cleanSel(){
  const ed=document.getElementById('editor');
  const s=ed.selectionStart,e=ed.selectionEnd;
  if(s===e){toast('⚠️ Pilih dulu teks yang mau di-clean');return;}
  const sel=ed.value.substring(s,e);
  const cleaned=sel.replace(CLEAN,' ').replace(/ {2,}/g,' ').trim();
  ed.setRangeText(cleaned,s,e,'select');
  toast(`✅ Cleaned: ${sel.length-cleaned.length} karakter dihapus`);
  upd();
}

function genAlias(name){
  // if already has comma, skip
  if(name.includes(',')) return name;
  const words=name.trim().split(/\s+/);
  if(words.length<2) return name;
  const last=words[words.length-1].toLowerCase();
  return name+','+last;
}

function toggleAlias(){
  autoAlias=!autoAlias;
  const chip=document.getElementById('alias-toggle');
  chip.classList.toggle('on',autoAlias);
  chip.textContent=autoAlias?'✓ A→':'A→';
  toast(autoAlias?'✅ Auto-alias ON':'⭕ Auto-alias OFF');
  lsSave();
}

function saveSel(){
  // Ambil teks dari filter-view selection jika filter aktif, fallback ke textarea
  let txt='';
  const fv=document.getElementById('ed-filter-view');
  const ed=document.getElementById('editor');
  if(fv.style.display!=='none'){
    // Baca window selection dari filter view
    const sel=window.getSelection();
    if(sel && sel.rangeCount>0){
      txt=sel.toString().trim();
    }
  }
  if(!txt){
    // Fallback: coba dari textarea
    const s=ed.selectionStart,e=ed.selectionEnd;
    txt=(s===e?'':ed.value.substring(s,e)).trim();
  }
  if(!txt){toast('⚠️ Pilih dulu teks yang mau disave');return;}
  const parts=txt.split(';').map(x=>x.trim()).filter(x=>x);
  let added=0;
  parts.forEach(p=>{
    const final=autoAlias?genAlias(p):p;
    if(!items.includes(final)){items.push(final);added++;}
  });
  render();
  updateBadge();
  lsSave();
  toast(`💾 +${added} item baru${parts.length>added?' ('+(parts.length-added)+' duplikat)':''}`);
}

function renderItem(it){
  const ci=it.indexOf(',');
  if(ci===-1) return `<span class="it-name">${esc(it)}</span>`;
  const name=it.substring(0,ci);
  const alias=it.substring(ci+1);
  return `<span class="it-name">${esc(name)}</span> <span class="it-alias">${esc(alias)}</span>`;
}

let renderTimer=null;
function scheduleRender(){
  // debounce 500ms — tunggu sampai berhenti ketik, baru filter
  clearTimeout(renderTimer);
  renderTimer=setTimeout(render,500);
}
function renderNow(){
  clearTimeout(renderTimer);
  render();
}

function render(){
  const q=document.getElementById('si').value.toLowerCase().trim();
  const lb=document.getElementById('list-body');
  updateBadge();
  if(!items.length){
    lb.innerHTML='<div class="hint">Belum ada item.<br>Pilih teks di <b>Editor</b><br>lalu klik <b>💾 Save</b></div>';
    return;
  }
  let vis=items.map((it,i)=>({it,i})).filter(({it})=>!q||it.toLowerCase().includes(q));
  if(q) vis=vis.slice().sort((a,b)=>a.it.localeCompare(b.it,'id'));
  if(!vis.length){lb.innerHTML='<div class="hint">Tidak ada hasil untuk "<b>'+esc(q)+'</b>"</div>';return;}
  lb.innerHTML=vis.map(({it,i},displayIdx)=>
    `<div class="li" data-idx="${i}">
      <span class="num">${displayIdx+1}</span>
      <span class="it" onclick="startEdit(${i})">${renderItem(it)}</span>
      <button class="dl" onclick="del(${i})">×</button>
    </div>`
  ).join('');
}

function updateBadge(){
  const b=document.getElementById('badge');
  b.textContent=items.length;
  b.classList.toggle('show',items.length>0);
}

function startEdit(i){
  const li=document.querySelector(`.li[data-idx="${i}"]`);
  if(!li) return;
  const target=li.querySelector('.it');
  if(!target) return;
  const inp=document.createElement('input');
  inp.className='ie';inp.value=items[i];
  inp.onblur=()=>{items[i]=inp.value.trim()||items[i];render();lsSave();};
  inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape')render();};
  target.replaceWith(inp);inp.focus();
}

function del(i){items.splice(i,1);render();lsSave();}

function clearAll(){
  if(!items.length)return;
  if(confirm(`Hapus semua ${items.length} item?`)){items=[];render();lsSave();}
}

function copyList(){
  if(!items.length){toast('⚠️ List kosong');return;}
  const txt=items.join(';');
  if(navigator.clipboard){
    navigator.clipboard.writeText(txt).then(()=>toast(`📋 Copied ${items.length} item`));
  } else {
    // fallback
    const ta=document.createElement('textarea');
    ta.value=txt;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    toast(`📋 Copied ${items.length} item`);
  }
}

function exportList(){
  if(!items.length){toast('⚠️ List kosong');return;}
  const txt=items.join(';');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download='filelist.txt';
  a.click();
  toast(`💾 Exported ${items.length} item`);
}

// Sync editor content → prLines (Parse tab)
function syncParseFromEditor(){
  const txt=document.getElementById('editor').value;
  prLines=txt.split('\n').map(prCleanLoad).filter(Boolean);
  // Update badge
  const bp=document.getElementById('badge-parse');
  bp.textContent=prLines.length;
  bp.classList.toggle('show',prLines.length>0);
  // Kalau Parse tab sedang aktif, refresh
  if(document.getElementById('p-parse').style.display!=='none') prDoSearch();
}

// Bulk hapus teks dari semua baris di editor + sync ke Parse
function bulkRemove(){
  const q=document.getElementById('bulk-input').value.trim();
  if(!q){toast('⚠️ Ketik teks yang mau dihapus');return;}
  const ed=document.getElementById('editor');
  if(!ed.value.trim()){toast('⚠️ Editor kosong');return;}
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  const before=ed.value.split('\n').length;
  // Hapus teks dari setiap baris, buang baris yang jadi kosong
  const lines=ed.value.split('\n')
    .map(l=>l.replace(re,'').replace(/\s{2,}/g,' ').trim())
    .filter(Boolean);
  const after=lines.length;
  ed.value=lines.join('\n');
  upd();lsSave();
  syncParseFromEditor();
  document.getElementById('bulk-input').value='';
  toast(`✂️ "${q}" dihapus — ${before-after} baris hilang, ${after} tersisa`);
}

function loadF(){document.getElementById('fi').click();}

let sortAsc=true;

function doFind(q){
  const ed=document.getElementById('editor');
  const fv=document.getElementById('ed-filter-view');
  const info=document.getElementById('find-info');
  const clearBtn=document.getElementById('find-clear-btn');
  const trimmed=q.trim();

  if(!trimmed){
    ed.style.display='';
    fv.style.display='none';
    info.textContent='';
    clearBtn.style.display='none';
    return;
  }

  const matched=ed.value.split('\n')
    .filter(l=>l.trim() && l.toLowerCase().includes(trimmed.toLowerCase()))
    .sort((a,b)=>a.localeCompare(b,'id'));

  ed.style.display='none';
  fv.style.display='block';
  info.textContent=matched.length ? matched.length+' baris' : '0';
  clearBtn.style.display='';

  if(!matched.length){
    fv.innerHTML='<div style="padding:40px 20px;text-align:center;color:var(--dim)">— tidak ada hasil —</div>';
    return;
  }
  const re=new RegExp('('+trimmed.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  fv.innerHTML=matched.map(l=>{
    const safe=l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return safe.replace(re,'<mark style="background:var(--yellow);color:#000;border-radius:2px;padding:0 1px">$1</mark>');
  }).join('\n');
}

function clearFind(){
  const inp=document.getElementById('ed-find');
  inp.value='';
  doFind('');
  inp.focus();
}

function sortEditor(){
  const ed=document.getElementById('editor');
  if(!ed.value.trim()){toast('\u26a0\ufe0f Editor kosong');return;}
  const filled=ed.value.split('\n').filter(l=>l.trim());
  filled.sort((a,b)=>sortAsc?a.localeCompare(b,'id'):b.localeCompare(a,'id'));
  ed.value=filled.join('\n');
  const btn=document.getElementById('sort-btn');
  btn.textContent=sortAsc?'Z\u2191':'A\u2193';
  btn.classList.toggle('desc',sortAsc);
  toast('\ud83d\udd21 Sort '+(sortAsc?'A\u2192Z':'Z\u2192A'));
  sortAsc=!sortAsc;
  upd();
}


// ── PARSE TAB ─────────────────────────────────────────
let prLines=[];   // semua baris filename yang belum diproses

// Dipanggil saat load/paste — strip & normalize sebelum disimpan
function prCleanLoad(raw){
  let n=raw.trim();
  n=n.replace(/\.[^.]+$/,'');           // strip ext
  n=n.replace(/^_+/,'');               // strip leading _
  n=n.replace(/_drawn_by_.*$/,'');     // strip drawn_by (sebelum _ diganti)
  n=n.replace(/_[0-9a-f]{32}$/,'');   // strip MD5
  n=n.replace(/_[0-9a-f]{8,16}$/,''); // strip short hash
  n=n.replace(/_p\d+$/,'');           // strip _p0
  n=n.replace(/[_.'()/:\-]+/g,' ');   // _ . ' ( ) / : - → space
  n=n.replace(/\s{2,}/g,' ').trim();
  return n;
}

// Normalize untuk matching (lowercase)
function prNorm(cleaned){
  return cleaned.toLowerCase().trim();
}

function prExtractChars(norm, frQ){
  const q=frQ.trim().toLowerCase();
  const idx=norm.indexOf(q);
  if(idx<0) return [];
  // Ambil KIRI franchise saja — kanan adalah tag lain/junk
  let left=norm.substring(0,idx).trim();
  // Split by " and " (multi karakter Danbooru)
  const parts=left.split(/\s+and\s+/)
    .map(c=>c.trim())
    .filter(c=>c && !/^\d+\s/.test(c)); // buang "1 more","5 more" tapi bukan "2B","9S"
  return parts;
}

function prWithAlias(charName){
  const words=charName.trim().split(/\s+/);
  if(words.length<2) return charName;
  const alias=words[words.length-1];
  // Jangan tambah alias kalau sama dengan nama atau 1 huruf
  if(alias===charName||alias.length<=1) return charName;
  return charName+','+alias;
}

function prTitleCase(s){
  return s.replace(/\b\w/g,c=>c.toUpperCase());
}

// Deduplicate: kalau "yuna li" dan "yuna" ada, ambil yang lebih spesifik
function prDedup(charArr){
  const sorted=[...charArr].sort((a,b)=>b.length-a.length);
  const result=[];
  sorted.forEach(name=>{
    const isDup=result.some(e=>e===name||e.startsWith(name+' ')||name.startsWith(e+' '));
    if(!isDup) result.push(name);
  });
  return result;
}

let prSearchTimer=null;
function prSearch(){
  clearTimeout(prSearchTimer);
  prSearchTimer=setTimeout(prDoSearch,200);
}

function prDoSearch(){
  const frQ=document.getElementById('pr-fr').value.trim().toLowerCase();
  const body=document.getElementById('pr-body');
  const preview=document.getElementById('pr-preview');
  const saveBtn=document.getElementById('pr-save');

  if(!prLines.length){
    body.innerHTML='<span style="color:var(--dim)">Paste atau load file dulu...</span>';
    preview.innerHTML='<span class="pr-prev-empty">Belum ada file diload</span>';
    saveBtn.style.display='none';
    return;
  }

  if(!frQ){
    prRenderAll();
    preview.innerHTML='<span class="pr-prev-empty">Ketik nama franchise untuk mulai...</span>';
    saveBtn.style.display='none';
    return;
  }

  // Filter baris yang mengandung franchise
  const matched=[];
  const unmatched=[];
  prLines.forEach(raw=>{
    const norm=prNorm(raw);
    if(norm.includes(frQ)) matched.push(raw);
    else unmatched.push(raw);
  });

  // Highlight dan tampilkan semua, yang match di atas
  const re=new RegExp('('+frQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  const mkLine=(raw,highlight)=>{
    const safe=raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if(highlight) return safe.replace(re,'<mark>$1</mark>');
    return `<span style="color:var(--dim)">${safe}</span>`;
  };
  body.innerHTML=[
    ...matched.map(r=>mkLine(r,true)),
    ...(unmatched.length?['<span style="color:var(--border)">─────────────────────</span>']:[]),
    ...unmatched.map(r=>mkLine(r,false))
  ].join('\n');

  // Extract karakter dari baris yang match
  const charSet=new Set();
  matched.forEach(raw=>{
    const norm=prNorm(raw);
    prExtractChars(norm,frQ).forEach(c=>{if(c) charSet.add(c);});
  });

  const chars=prDedup([...charSet]);
  if(!matched.length){
    preview.innerHTML=`<span class="pr-prev-empty">Tidak ada file yang cocok dengan "${esc(frQ)}"</span>`;
    saveBtn.style.display='none';
  } else if(!chars.length){
    preview.innerHTML=`
      <span class="pr-prev-fr">Franchise: <b>${esc(prTitleCase(frQ))}</b> · ${matched.length} file</span>
      <span class="pr-prev-empty">Tidak ada nama karakter terdeteksi (mungkin file hanya berisi franchise tag)</span>`;
    saveBtn.style.display='';
  } else {
    const charStr=chars.map(prWithAlias).join(';');
    preview.innerHTML=`
      <span class="pr-prev-fr">Franchise: <b>${esc(prTitleCase(frQ))}</b> · ${matched.length} file · ${chars.length} karakter</span>
      <span class="pr-prev-chars">${esc(charStr)}</span>
      <span class="pr-prev-count">→ akan disave sebagai: <code style="color:var(--accent)">${esc(prTitleCase(frQ))}/${esc(charStr)}</code></span>`;
    saveBtn.style.display='';
  }
}

function prRenderAll(){
  const body=document.getElementById('pr-body');
  if(!prLines.length){
    body.innerHTML='<span style="color:var(--dim)">Paste atau load file dulu...</span>';
    return;
  }
  body.innerHTML=prLines.map(r=>{
    const safe=r.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return safe;
  }).join('\n');
}

function prSave(){
  const frQ=document.getElementById('pr-fr').value.trim().toLowerCase();
  if(!frQ){toast('⚠️ Ketik nama franchise dulu');return;}

  const matched=[];
  const remaining=[];
  prLines.forEach(raw=>{
    if(prNorm(raw).includes(frQ)) matched.push(raw);
    else remaining.push(raw);
  });

  if(!matched.length){toast('Tidak ada file yang cocok');return;}

  // Kumpulkan semua karakter unik
  const charSet=new Set();
  matched.forEach(raw=>{
    prExtractChars(prNorm(raw),frQ).forEach(c=>{if(c) charSet.add(c);});
  });

  const frTitle=prTitleCase(frQ);
  const chars=prDedup([...charSet]);
  const entry=frTitle+'/'+(chars.length?chars.map(prWithAlias).join(';'):frTitle);

  if(!items.includes(entry)){items.push(entry);}
  else{
    // Merge karakter baru ke entry yang sudah ada
    const idx=items.findIndex(i=>i.startsWith(frTitle+'/'));
    if(idx>=0){
      const existing=items[idx].substring(frTitle.length+1).split(';');
      const merged=[...new Set([...existing,...chars.map(prWithAlias)])];
      items[idx]=frTitle+'/'+merged.join(';');
    }
  }

  // Hapus baris yang sudah diproses
  prLines=remaining;
  document.getElementById('pr-fr').value='';
  prDoSearch();
  render();updateBadge();lsSave();
  toast(`✅ ${frTitle}: ${chars.length} karakter — ${matched.length} baris dihapus`);
  if(!prLines.length) toast('🎉 Semua file sudah diproses!');
}

function prPaste(){
  if(!navigator.clipboard){toast('⚠️ Clipboard tidak tersedia, gunakan Load');return;}
  navigator.clipboard.readText().then(txt=>{
    if(!txt.trim()){toast('⚠️ Clipboard kosong');return;}
    prLines=txt.split('\n').map(prCleanLoad).filter(Boolean);
    document.getElementById('pr-fr').value='';
    prDoSearch();
    toast(`📋 ${prLines.length} file diload`);
  }).catch(()=>toast('⚠️ Clipboard tidak bisa diakses, gunakan Load'));
}

function prLoad(){document.getElementById('pr-fi').click();}
function prHandleFile(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    prLines=ev.target.result.split('\n').map(prCleanLoad).filter(Boolean);
    document.getElementById('pr-fr').value='';
    prDoSearch();
    toast(`📁 ${f.name} — ${prLines.length} file`);
  };
  r.readAsText(f,'utf-8');
  e.target.value='';
}

function prClear(){
  if(!prLines.length)return;
  if(confirm(`Hapus semua ${prLines.length} baris?`)){
    prLines=[];
    document.getElementById('pr-fr').value='';
    prDoSearch();
  }
}

// Init
prDoSearch();

function parseFilename(raw){
  let n=raw.trim();
  n=n.replace(/\.[^.]+$/,'');           // strip extension
  n=n.replace(/_drawn_by_.*$/,'');      // strip drawn_by
  n=n.replace(/_[0-9a-f]{32}$/,'');    // strip MD5 hash
  n=n.replace(/_[0-9a-f]{8,16}$/,'');  // strip short hash
  n=n.replace(/_p\d+$/,'');            // strip page suffix _p0
  n=n.replace(/_/g,' ').toLowerCase().trim();
  return n;
}

// Init parse tab
prDoSearch();

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}


let tt;
function toast(m){
  const el=document.getElementById('toast');
  el.textContent=m;el.classList.add('s');
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('s'),2500);
}
